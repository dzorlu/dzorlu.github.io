project:
  type: website

website:
  title: "Tinkerings"
  site-url: https://tinkerings.dev
  navbar:
    right:
      - icon: github
        href: https://github.com/dzorlu
        aria-label: GitHub
  page-footer:
    left: "Tinkerings"
    right:
      - icon: github
        href: https://github.com/dzorlu
        aria-label: GitHub

resources:
  - static/moe.html
  - static/moe-preview.png
  - images/**
  - posts/bias-variance/**
  - posts/score-centering/**

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark: [cosmo, custom.scss, dark.scss]
    highlight-style: github
    include-in-header: color-scheme.html
    code-copy: true
    code-line-numbers: false
    toc: false
    grid:
      body-width: 760px
      sidebar-width: 220px
      margin-width: 220px

execute:
  echo: false
  warning: false
